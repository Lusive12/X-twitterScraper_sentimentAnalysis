services:
  mongodb:
    image: mongo:7.0
    container_name: purbaya_mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASS}
      - MONGO_INITDB_DATABASE=${MONGO_DB}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - purbaya_network

  mongo-express:
    image: mongo-express:latest
    container_name: purbaya_mongo_express
    environment:
      # Web Interface Login (What you type in the browser)
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin123
      # Connection to the actual MongoDB (Format diperbaiki menggunakan - dan =)
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGO_USER}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_PASS}
      - ME_CONFIG_MONGODB_URL=mongodb://${MONGO_USER}:${MONGO_PASS}@mongodb:27017/
    ports:
      - "8081:8081"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - purbaya_network

  n8n:
    image: n8nio/n8n:latest
    container_name: purbaya_n8n
    environment:
      - N8N_PORT=5678
      - GENERIC_TIMEZONE=Asia/Jakarta
      # Credentials passed into n8n environment
      - X_BEARER_TOKEN=${X_BEARER_TOKEN}
      - X_ACCESS_TOKEN=${X_ACCESS_TOKEN}
      - X_ACCESS_TOKEN_SECRET=${X_ACCESS_TOKEN_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "5679:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - purbaya_network

  metabase:
    image: metabase/metabase:latest
    container_name: purbaya_metabase
    ports:
      - "3000:3000"
    volumes:
      - metabase_data:/metabase-data
    networks:
      - purbaya_network

networks:
  purbaya_network:
    driver: bridge

volumes:
  mongodb_data:
  n8n_data:
  metabase_data: